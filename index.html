<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Braid Bookings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="page-glow min-h-screen bg-lilac-50 font-sans text-plum-950 antialiased dark:bg-plum-950 dark:text-lilac-100">
    <main class="mx-auto max-w-xl px-4 py-8 sm:py-12">
      <header class="mb-8">
        <div class="flex items-start justify-between gap-4">
          <h1 class="font-display text-4xl font-extrabold tracking-tight text-plum-900 sm:text-5xl dark:text-gold-400">
            Braid Bookings
          </h1>
          <button
            id="theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
            aria-pressed="false"
            class="shrink-0 rounded-full bg-white px-4 py-2 text-sm font-semibold text-plum-900 shadow-sm ring-1 ring-plum-900/10 transition hover:bg-lilac-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold-500 dark:bg-plum-800 dark:text-lilac-100 dark:ring-white/10 dark:hover:bg-plum-700"
          >
            Dark
          </button>
        </div>
        <div class="braid-strip mt-4" aria-hidden="true"></div>
        <p class="mt-4 text-plum-700 dark:text-lilac-200">
          Every client, every style, every prep step. Keep your braiding day in order.
        </p>
      </header>

      <section class="rounded-3xl bg-white/80 p-5 shadow-xl shadow-plum-900/10 ring-1 ring-plum-900/5 backdrop-blur sm:p-6 dark:bg-plum-900/70 dark:shadow-black/30 dark:ring-white/10">
        <form id="task-form" class="flex gap-2" novalidate>
          <label for="task-input" class="sr-only">New braiding task</label>
          <input
            id="task-input"
            type="text"
            autocomplete="off"
            placeholder="e.g. Box braids for Aline, 10:00"
            class="min-w-0 flex-1 rounded-xl border-2 border-lilac-200 bg-white px-4 py-3 placeholder:text-plum-700/50 focus-visible:border-magenta-600 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-gold-400/40 dark:border-plum-700 dark:bg-plum-800 dark:placeholder:text-lilac-200/40"
          />
          <button
            type="submit"
            class="rounded-xl bg-magenta-600 px-5 py-3 font-bold text-white shadow-md shadow-magenta-600/30 transition hover:bg-magenta-700 active:translate-y-px focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-gold-400/60"
          >
            Add
          </button>
        </form>
        <p id="error" role="alert" class="min-h-6 pt-2 text-sm font-medium text-magenta-700 dark:text-pink-300"></p>

        <div class="mt-1">
          <label for="search-input" class="sr-only">Search tasks</label>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            placeholder="Search tasks"
            class="w-full rounded-xl border-2 border-transparent bg-lilac-100 px-4 py-2.5 placeholder:text-plum-700/60 focus-visible:border-magenta-600 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-gold-400/40 dark:bg-plum-800 dark:placeholder:text-lilac-200/50"
          />
        </div>

        <div
          id="filters"
          class="mt-5 inline-flex rounded-full bg-lilac-100 p-1 dark:bg-plum-800"
          role="group"
          aria-label="Filter tasks"
        >
          <button type="button" data-filter="all">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </div>

        <ul id="task-list" class="mt-5 space-y-2.5"></ul>
        <p
          id="empty-state"
          class="mt-5 rounded-2xl border-2 border-dashed border-lilac-200 p-8 text-center font-medium text-plum-700 dark:border-plum-700 dark:text-lilac-200"
          hidden
        ></p>

        <div class="mt-5 flex items-center justify-between border-t border-lilac-100 pt-4 text-sm dark:border-plum-800">
          <p id="counter" aria-live="polite" class="font-bold text-plum-900 dark:text-gold-400"></p>
          <button
            id="clear-completed"
            type="button"
            class="rounded-full px-4 py-1.5 font-semibold text-magenta-700 transition hover:bg-lilac-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold-500 disabled:opacity-40 dark:text-pink-300 dark:hover:bg-plum-800"
          >
            Clear completed
          </button>
        </div>
      </section>
    </main>

    <dialog
      id="confirm-dialog"
      aria-labelledby="confirm-text"
      class="m-auto w-80 max-w-[90vw] rounded-2xl bg-white p-6 text-plum-950 shadow-2xl backdrop:bg-plum-950/60 backdrop:backdrop-blur-sm dark:bg-plum-900 dark:text-lilac-100"
    >
      <p id="confirm-text" class="mb-5 break-words font-medium"></p>
      <form method="dialog" class="flex justify-end gap-2">
        <button
          value="cancel"
          class="rounded-full px-4 py-2 font-semibold transition hover:bg-lilac-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold-500 dark:hover:bg-plum-800"
        >
          Cancel
        </button>
        <button
          value="confirm"
          class="rounded-full bg-magenta-600 px-4 py-2 font-bold text-white transition hover:bg-magenta-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold-400"
        >
          Delete
        </button>
      </form>
    </dialog>
  </body>
</html>
